<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Orders Panel – Kabir Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #333;
        }
        .page-header {
            padding: 1.5rem 2rem;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 0;
        }
        .page-header h1 { color: #2c3e50; font-weight: 700; font-size: 1.8rem; margin-bottom: 0.2rem; }
        .page-header p { color: #7f8c8d; font-size: 0.95rem; margin: 0; }
        .btn-primary { background-color: #2c3e50; border: none; font-weight: 500; }
        .btn-primary:hover { background-color: #1a252f; }
        .placeholder-wrap {
            min-height: calc(100vh - 90px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 2rem;
        }
        .placeholder-icon { font-size: 4rem; margin-bottom: 1.5rem; }
        .placeholder-title { font-size: 1.6rem; font-weight: 700; color: #2c3e50; margin-bottom: 0.6rem; }
        .placeholder-desc { color: #7f8c8d; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="page-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <!-- <button class="btn btn-outline-secondary btn-sm" onclick="window.location.href='/dashboard'">← Home</button> -->
            <div>
                <h1>Orders Panel</h1>
                <p>Customer orders and booking management</p>
            </div>
        </div>
        <!-- <button class="btn btn-outline-danger btn-sm" onclick="logout()">🚪 Logout</button> -->
    </div>

    <div class="placeholder-wrap">
        <div class="placeholder-icon">🛒</div>
        <div class="placeholder-title">Coming Soon</div>
        <div class="placeholder-desc">The Orders Panel is currently under development. Check back soon!</div>
    </div>

    <script>
        function getBasePath() {
            const path = window.location.pathname || "/";
            const customerServiceIndex = path.indexOf("/customerService_app");
            if (customerServiceIndex !== -1) {
                return path.slice(0, customerServiceIndex + "/customerService_app".length);
            }
            if (path.startsWith("/support/") || path === "/support") return "/support";
            return "";
        }
        const BASE = getBasePath();

        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = `${BASE}/logout`;
            }
        }

        // Fix Home button to respect base path
        const homeButton = document.querySelector('[onclick="window.location.href=\'/dashboard\'"]');
        if (homeButton) {
            homeButton.setAttribute('onclick', `window.location.href='${BASE}/dashboard'`);
        }
    </script>
</body>
</html>
