<script>
        let lastRequestDisplayItems = [];

        async function loadMagicWordRequests(filterUserId = null, isBackgroundPoll = false) {
            try {
                let url = `${API_BASE}/magic-words`;
                if (filterUserId) url += `?userId=${encodeURIComponent(filterUserId)}`;
                const response = await fetch(url);
                const data = await response.json();
                const allItems = data.items || [];
                // On the Overview tab, both the stat count and the queue below scope
                // to the selected stats range together; the dedicated Requests tab
                // always shows the full backlog. See getOverviewScopedItems in
                // scripts/_state.html.
                const displayItems = getOverviewScopedItems(allItems, getRequestDateValue);
                document.getElementById("requestCount").textContent = displayItems.length;
                updateDashboardStats(displayItems);
                const latestItem = allItems.length > 0 ? allItems[0] : null;
                const latestTime = latestItem ? new Date(latestItem.matchedAt).getTime() : 0;
                if (lastLatestRequestTime > 0 && latestTime > lastLatestRequestTime && !filterUserId) {
                    if (isSoundEnabled) playNotificationSound();
                    try { const toast = document.getElementById("newRequestToast"); if (toast && typeof bootstrap !== 'undefined') { bootstrap.Toast.getOrCreateInstance(toast).show(); } } catch (e) { }
                }
                if (latestItem) { lastLatestRequestId = latestItem.id; if (latestTime > lastLatestRequestTime || lastLatestRequestTime === 0) lastLatestRequestTime = latestTime; }
                const listContainer = document.getElementById("listView");
                if (isBackgroundPoll && listContainer.classList.contains("hidden")) return;

                lastRequestDisplayItems = displayItems;

                const filterContainer = document.getElementById("filterBadgeContainer");
                if (filterUserId) {
                    filterContainer.innerHTML = `<div class="alert alert-info mb-3" style="border-radius:5px;padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;"><span style="display:flex;align-items:center;gap:0.5rem;"><strong>Filtered Results</strong><code style="background:white;padding:0.3rem 0.6rem;border-radius:3px;color:#2c3e50;font-weight:600;">${escapeHtml(filterUserId)}</code></span><button class="btn btn-sm btn-outline-secondary" onclick="clearUserFilter()" style="font-size:0.8rem;padding:0.3rem 0.8rem;">Clear Filter</button></div>`;
                } else { filterContainer.innerHTML = ""; }

                if (!data.found || allItems.length === 0) {
                    document.getElementById("emptyMessage").classList.remove("hidden");
                    document.getElementById("requestsList").innerHTML = "";
                    document.getElementById("emptyMessage").textContent = filterUserId ? `No requests found for user: ${filterUserId}` : (currentDashboardTab === "overview" ? "No requests found in the selected range" : "No magic word requests found");
                    return;
                }

                renderRequestRows(applyRequestSearch(displayItems));
            } catch (error) { document.getElementById("emptyMessage").textContent = "Error loading requests"; document.getElementById("emptyMessage").classList.remove("hidden"); document.getElementById("filterBadgeContainer").innerHTML = ""; }
        }

        function requestMatchesQuery(item, q) {
            const haystack = [
                getTravellerName(item),
                item.service_name || item.typeOfService || item.magicWord || "",
                item.userMessage || item.message || item.location || "",
                item.status || "",
                item.id || "",
                item.userId || ""
            ].join(" ").toLowerCase();
            return haystack.includes(q);
        }

        function applyRequestSearch(items) {
            const q = (document.getElementById("requestSearchQuery")?.value || "").trim().toLowerCase();
            return q ? items.filter(item => requestMatchesQuery(item, q)) : items;
        }

        function filterRequestSearch() {
            renderRequestRows(applyRequestSearch(lastRequestDisplayItems));
        }

        function renderRequestRows(items) {
            const emptyEl = document.getElementById("emptyMessage");
            const listEl = document.getElementById("requestsList");
            if (items.length === 0) {
                emptyEl.classList.remove("hidden");
                emptyEl.textContent = "No requests match this search";
                listEl.innerHTML = "";
                return;
            }
            emptyEl.classList.add("hidden");
            listEl.innerHTML = items.map(item => {
                const date = formatDateShort(getRequestDateValue(item));
                const travellerName = getTravellerName(item);
                const namedService = item.service_name || item.typeOfService || "";
                const service = namedService || "Magic Word";
                const message = item.userMessage || item.message || item.location
                    || (item.magicWord && !namedService ? `Triggered by "${item.magicWord}"` : "Latest request update");
                return `<button class="traviz-request-row" type="button" onclick="loadMagicWordDetail('${item.id}')">
                    <span class="traviz-person" style="background:${getAvatarColor(travellerName)};">${escapeHtml(getInitials(travellerName))}</span>
                    <span class="traviz-row-main"><span class="traviz-primary">${escapeHtml(travellerName)}</span><span class="traviz-secondary">${escapeHtml(message)}</span></span>
                    <span class="traviz-service">${escapeHtml(service)}</span>
                    <span class="traviz-time">${escapeHtml(date)}</span>
                    <span class="badge ${getStatusBadgeClass(item.status)}">${escapeHtml(item.status || "new")}</span>
                </button>`;
            }).join("");
        }

        function formatDateShort(isoString) {
            if (!isoString) return "N/A";
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return isoString;
                return date.toLocaleString('en-US', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
            } catch (e) { return isoString; }
        }

        async function loadMagicWordDetail(id) {
            try {
                currentMagicWordId = id;
                const response = await fetch(`${API_BASE}/magic-words/${id}`);
                const data = await response.json();
                if (!data.found) { alert("Error loading details"); return; }
                const magic = data.magic_word_request || {}, user = data.user || {}, chat = data.chat || {}, location = data.user_location || {};
                document.getElementById("detail-magicWord").textContent = magic.magicWord || "N/A";
                document.getElementById("detail-status").textContent = magic.status || "N/A";
                document.getElementById("detail-status").className = `badge ${getStatusBadgeClass(magic.status)}`;
                document.getElementById("detail-matchedAt").textContent = formatDateShort(magic.matchedAt) || "N/A";
                document.getElementById("detail-location").textContent = chat.location || "N/A";
                document.getElementById("detail-chatId").textContent = chat.id || "N/A";
                document.getElementById("detail-messageId").textContent = magic.messageId || "N/A";
                document.getElementById("detail-userId").textContent = user.id || "N/A";
                document.getElementById("detail-userName").textContent = `${user.firstName || ""} ${user.lastName || ""}`.trim() || "N/A";
                document.getElementById("detail-userEmail").textContent = user.email || "N/A";
                document.getElementById("detail-userPhone").textContent = user.phoneNumber || "N/A";
                if (user.photoURL) { document.getElementById("detail-userPhoto").src = user.photoURL; document.getElementById("detail-userPhoto").style.display = "block"; }
                else { document.getElementById("detail-userPhoto").style.display = "none"; }
                document.getElementById("detail-locName").textContent = location.location || "N/A";
                document.getElementById("detail-locLat").textContent = location.latitude || "N/A";
                document.getElementById("detail-locLon").textContent = location.longitude || "N/A";
                document.getElementById("detail-locRecordedAt").textContent = formatDateShort(location.created_at) || "N/A";
                document.getElementById("detail-mapLink").href = (location.latitude && location.longitude) ? `https://maps.google.com/?q=${location.latitude},${location.longitude}` : "#";
                currentStatus = magic.status || "requested";
                currentServiceRequestId = magic.serviceRequestId || magic.orderId || null;
                updateStatusButtonText(currentStatus);
                if (currentStatus === "requested") { updateMagicWordStatus("inProgress", false); currentStatus = "inProgress"; document.getElementById("detail-status").textContent = "inProgress"; document.getElementById("detail-status").className = `badge ${getStatusBadgeClass("inProgress")}`; updateStatusButtonText("inProgress"); }
                const chatId = chat.id;
                if (chatId) { startChatPolling(chatId); loadChatMessages(chatId); }
                else { stopChatPolling(); renderChatMessages([], "detail-chatContext", '<div class="text-center text-muted mt-3">No chat linked to this request.</div>'); }
                if (user.id) { await loadUserMagicWordRequests(user.id); loadOrderHistory(user.id); loadPaymentHistory(user.id); }
                showDetailView();
            } catch (error) { alert("Error loading details"); }
        }
</script>
