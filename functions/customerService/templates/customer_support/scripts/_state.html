<script>
        const BASE = getCustomerServiceBasePath();
        const API_BASE = `${BASE}/api`;


        async function logout() {
            await logoutCustomerService({ stopPolling: true });
        }

        let currentMagicWordId = null, currentStatus = null, currentServiceRequestId = null, currentFilteredUserId = null, currentFilteredOrderUserId = null, currentServiceOrderChatId = null;
        let selectedSearchedUserId = null;
        let lastLatestRequestId = null, lastLatestRequestTime = 0;
        let isSoundEnabled = localStorage.getItem('isSoundEnabled') === 'true';
        let currentDashboardTab = "overview";

        function updateSoundButtonUI() {
            const btn = document.getElementById("soundToggleBtn");
            if (!btn) return;
            if (isSoundEnabled) { btn.textContent = "Sound On"; btn.classList.remove("btn-outline-secondary"); btn.classList.add("btn-success"); }
            else { btn.textContent = "Sound Off"; btn.classList.remove("btn-success"); btn.classList.add("btn-outline-secondary"); }
        }
        document.addEventListener("DOMContentLoaded", () => { updateSoundButtonUI(); });

        function playNotificationSound() {
            const audio = document.getElementById("notificationSound");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => { });
                return;
            }

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const context = new AudioContext();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(880, context.currentTime);
                gain.gain.setValueAtTime(0.001, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.22, context.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.32);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                oscillator.stop(context.currentTime + 0.35);
                oscillator.onended = () => context.close();
            } catch (e) { }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            localStorage.setItem('isSoundEnabled', isSoundEnabled);
            updateSoundButtonUI();
            if (isSoundEnabled) playNotificationSound();
        }

        function getRequestDateValue(item) {
            return item.matchedAt || item.created_at || item.createdAt || item.updated_at || item.updatedAt;
        }

        function getOrderDateValue(item) {
            return item.field_values?.travel_date || item.date_of_service || item.created_at || item.createdAt || item.updated_at || item.updatedAt;
        }

        // ✅ Overview stats reporting window, driven by the range dropdown in
        // the hero. On the Overview tab, both the stat cards and the Request
        // Queue / Recent Service Orders panels below scope to this range
        // together. The dedicated Requests / Orders tabs (from the sidebar)
        // are the actual working queues and always show the full backlog
        // regardless of this range.
        let statsRangeMode = "7"; // "7" | "30" | "90" | "custom"
        let statsRangeCustom = { start: null, end: null };

        function getStatsRangeBounds() {
            const end = new Date();
            end.setHours(23, 59, 59, 999);
            if (statsRangeMode === "custom" && statsRangeCustom.start && statsRangeCustom.end) {
                return {
                    start: new Date(`${statsRangeCustom.start}T00:00:00`),
                    end: new Date(`${statsRangeCustom.end}T23:59:59`)
                };
            }
            const days = parseInt(statsRangeMode, 10) || 7;
            const start = new Date();
            start.setDate(start.getDate() - (days - 1));
            start.setHours(0, 0, 0, 0);
            return { start, end };
        }

        function filterByStatsRange(items, dateGetter) {
            const { start, end } = getStatsRangeBounds();
            return items.filter(item => {
                const raw = dateGetter(item);
                if (!raw) return false;
                const d = new Date(raw);
                return !isNaN(d.getTime()) && d >= start && d <= end;
            });
        }

        function getOverviewScopedItems(items, dateGetter) {
            return currentDashboardTab === "overview" ? filterByStatsRange(items, dateGetter) : items;
        }
</script>
