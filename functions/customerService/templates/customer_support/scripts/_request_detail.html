<script>
        async function loadUserMagicWordRequests(userId) {
            if (!userId) { document.getElementById("noRequestSummary").classList.remove("hidden"); document.getElementById("requestSummaryContent").innerHTML = ""; return; }
            const response = await fetch(`${API_BASE}/magic-words/user/${userId}`);
            const data = await response.json();
            if (!data.found || !data.requests || data.requests.length === 0) { document.getElementById("noRequestSummary").classList.remove("hidden"); document.getElementById("requestSummaryContent").innerHTML = ""; return; }
            document.getElementById("noRequestSummary").classList.add("hidden");
            document.getElementById("requestSummaryContent").innerHTML = data.requests.map((req, index) =>
                `<div class="request-summary-item"><div class="request-summary-item-header"><span class="request-summary-item-title">Request ${index + 1}</span><span class="badge ${getStatusBadgeClass(req.status)}">${req.status || 'N/A'}</span></div><div class="request-summary-item-body"><p><strong>Magic Word:</strong> <span style="background-color:#fff3cd;padding:0.2rem 0.4rem;border-radius:3px;">${escapeHtml(req.magicWord || req.userMessage || "N/A")}</span></p><p><strong>Time:</strong> ${escapeHtml(formatDateShort(req.matchedAt || req.createdAt || req.updated_at))}</p></div></div>`
            ).join("");
        }

        async function loadOrderHistory(userId) {
            if (!userId) { const s = document.getElementById("summary-userId"); const d = document.getElementById("detail-userId"); if (s && s.textContent.trim() !== "N/A" && s.textContent.trim()) userId = s.textContent.trim(); else if (d && d.textContent.trim() !== "N/A" && d.textContent.trim()) userId = d.textContent.trim(); }
            const container = document.getElementById("orderHistoryContent");
            if (!container) return;
            if (!userId || userId === "N/A") { container.innerHTML = '<div class="text-center text-muted p-2">Search for a user to see history</div>'; return; }
            container.innerHTML = '<div class="text-center text-muted p-2">Loading orders...</div>';
            try {
                const response = await fetch(`${API_BASE}/magic-words/user/${userId}/orders`);
                const data = await response.json();
                if (!data.found || !data.orders || data.orders.length === 0) { container.innerHTML = '<div class="alert alert-secondary text-center m-2">No completed orders found</div>'; return; }
                let html = '<ul class="list-group list-group-flush">';
                data.orders.forEach(order => {
                    const status = order.status || "N/A"; let badgeClass = "bg-secondary";
                    const s = status.toLowerCase();
                    if (s === "booked" || s === "confirmed" || s === "success") badgeClass = "bg-success";
                    else if (s === "pending") badgeClass = "bg-warning text-dark";
                    else if (s === "cancelled" || s === "failed") badgeClass = "bg-danger";
                    const displayTitle = order.item_id ? `${order.product_type || "Order"} (${order.item_id})` : (order.product_type || "Order");
                    html += `<li class="list-group-item d-flex justify-content-between align-items-center"><div><small class="text-muted">${formatDateShort(order.timestamp_iso || order.timestamp) || "N/A"}</small><br><strong>${escapeHtml(displayTitle)}</strong><div class="small text-muted">ID: ${order.id.slice(-5)}</div></div><div class="text-end"><span class="badge ${badgeClass}">${status}</span></div></li>`;
                });
                html += '</ul>'; container.innerHTML = html;
            } catch (e) { container.innerHTML = '<div class="text-danger text-center p-2">Error loading orders</div>'; }
        }

        async function loadPaymentHistory(userId = null) {
            if (!userId) { const s = document.getElementById("summary-userId"); const d = document.getElementById("detail-userId"); if (s && s.textContent.trim() !== "N/A" && s.textContent.trim()) userId = s.textContent.trim(); else if (d && d.textContent.trim() !== "N/A" && d.textContent.trim()) userId = d.textContent.trim(); }
            const container = document.getElementById("paymentHistoryContent");
            if (!container) return;
            if (!userId || userId === "N/A") { container.innerHTML = '<div class="text-center text-muted p-2">Search for a user to see history</div>'; return; }
            container.innerHTML = '<div class="text-center text-muted p-2">Loading payments...</div>';
            try {
                const response = await fetch(`${API_BASE}/magic-words/user/${userId}/payments`);
                const data = await response.json();
                if (!data.found || !data.payments || data.payments.length === 0) { container.innerHTML = '<div class="alert alert-secondary text-center m-2">No payment history found</div>'; return; }
                let html = '<ul class="list-group list-group-flush">';
                data.payments.forEach(pay => {
                    html += `<li class="list-group-item"><div class="d-flex justify-content-between"><strong>${pay.amount ? `â‚¹${pay.amount}` : "N/A"}</strong><span class="badge bg-success">${pay.paymentStatus}</span></div><small class="text-muted d-block">${formatDateShort(pay.createdAt)}</small><small class="text-secondary">${pay.services || "Service"}</small><div class="small text-muted" style="font-size:0.75rem;">${pay.paymentId ? `ID: ${pay.paymentId.slice(0, 10)}...` : "Online"}</div></li>`;
                });
                html += '</ul>'; container.innerHTML = html;
            } catch (e) { container.innerHTML = '<div class="text-danger text-center p-2">Error loading payments</div>'; }
        }

        async function changeStatus() {
            if (!currentMagicWordId) return;
            const response = await fetch(`${API_BASE}/magic-words/${currentMagicWordId}`);
            const data = await response.json();
            currentStatus = data.magic_word_request?.status || "requested";
            currentServiceRequestId = data.magic_word_request?.serviceRequestId || data.magic_word_request?.orderId || null;
            if (currentStatus === "requested" || (currentStatus === "inProgress" && !currentServiceRequestId)) {
                document.getElementById("serviceRequestForm").reset();
                document.getElementById("dynamicServiceFields").innerHTML = "";
                document.getElementById("fixedServiceFields").style.display = "none";
                currentServiceFormConfig = null;
                currentPriceSummary = { items: [], total: 0 };
                pendingUserPrefill = data.user ? { firstName: data.user.firstName || "", phoneNumber: data.user.phoneNumber || "" } : null;
                await loadServiceCatalog();
                new bootstrap.Modal(document.getElementById("serviceRequestModal")).show();
            } else if (currentStatus === "inProgress") { await updateMagicWordStatus(); }
        }

        function closeRequest() {
            if (!currentMagicWordId) return;
            if (confirm("Are you sure you want to close this request?")) { document.getElementById("completionReason").value = ""; new bootstrap.Modal(document.getElementById("completionReasonModal")).show(); }
        }

        let chatPollingInterval = null;
        function startChatPolling(chatId, target = "magic") {
            stopChatPolling();
            if (!chatId) return;
            chatPollingInterval = setInterval(() => {
                if (target === "serviceOrder") loadServiceOrderChatMessages(chatId);
                else loadChatMessages(chatId);
            }, 3000);
        }
        function stopChatPolling() { if (chatPollingInterval) { clearInterval(chatPollingInterval); chatPollingInterval = null; } }

        function renderChatMessages(messages, chatContainerId, emptyHtml = '<div class="text-center text-muted mt-3">No messages yet.</div>') {
            const chatContainer = document.getElementById(chatContainerId);
            if (!chatContainer) return;
            const wasAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 50;
            chatContainer.innerHTML = "";
            if (!messages || messages.length === 0) { chatContainer.innerHTML = `<div class="chat-empty"><div><div style="font-size:2rem;opacity:.55;">💬</div><div>${emptyHtml}</div></div></div>`; return; }
            let lastDate = "";
            messages.forEach(msg => {
                const dateObj = new Date(msg.created_at);
                const dateStr = isNaN(dateObj.getTime()) ? 'Unknown Date' : dateObj.toLocaleDateString('en-US', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
                if (dateStr !== lastDate) { const db = document.createElement("div"); db.className = "chat-date-divider"; db.textContent = dateStr; chatContainer.appendChild(db); lastDate = dateStr; }
                const wrapper = document.createElement("div");
                const isUser = msg.role === "user";
                const side = isUser ? "user" : "assistant";
                const sender = isUser ? "Customer" : (msg.user_id === "CustomerService" ? "Support team" : "Kabir assistant");
                const initials = isUser ? "CU" : "CS";
                wrapper.className = `chat-row ${side}`;
                let contentHtml = "";
                if (msg.content) contentHtml += `<div>${escapeHtml(msg.content)}</div>`;
                if (msg.image_url) contentHtml += `<img src="${escapeHtml(msg.image_url)}" alt="Message attachment" class="chat-attachment" onclick="window.open(this.src,'_blank')">`;
                if (msg.audio_url) contentHtml += `<audio controls class="mt-2" style="max-width:220px;"><source src="${escapeHtml(msg.audio_url)}"></audio>`;
                const formattedTime = msg.created_at ? formatDateShort(msg.created_at) : '';
                const timeStr = formattedTime ? (formattedTime.split(', ')[1] || formattedTime) : '';
                const metaStr = isUser ? timeStr : ` ${timeStr || 'Just now'}`;
                wrapper.innerHTML = isUser
                    ? `<div class="chat-bubble-wrap"><div class="chat-sender">${sender}</div><div class="chat-bubble user">${contentHtml}</div><div class="chat-meta">${metaStr}</div></div><div class="chat-avatar user" aria-hidden="true">${initials}</div>`
                    : `<div class="chat-avatar assistant" aria-hidden="true">${initials}</div><div class="chat-bubble-wrap"><div class="chat-sender">${sender}</div><div class="chat-bubble assistant">${contentHtml}</div><div class="chat-meta">${metaStr}</div></div>`;
                chatContainer.appendChild(wrapper);
            });
            if (wasAtBottom) chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadChatMessages(chatId) {
            if (!chatId) return;
            try {
                const response = await fetch(`${API_BASE}/chats/${chatId}/messages`);
                const data = await response.json();
                if (data.success && data.messages) renderChatMessages(data.messages, "detail-chatContext");
            } catch (e) { console.error("Chat poll error:", e); }
        }

        async function loadServiceOrderChatMessages(chatId) {
            if (!chatId) return;
            try {
                const response = await fetch(`${API_BASE}/chats/${chatId}/messages`);
                const data = await response.json();
                if (data.success && data.messages) renderChatMessages(data.messages, "sod-chatContext");
            } catch (e) { console.error("Service order chat poll error:", e); }
        }

        // -----------------------------------------------------------------
        // Dynamic, per-service booking form
        // Renders formFields from /api/service-catalog/<serviceId>/form so
        // each service (tour guide, cab, photographer, ...) shows only its
        // own fields instead of one generic form for every service.
        // -----------------------------------------------------------------
        let currentServiceFormConfig = null;
        let pendingUserPrefill = null;
        let currentPriceSummary = { items: [], total: 0 };

        async function loadServiceCatalog() {
            const select = document.getElementById("serviceCatalogSelect");
            select.innerHTML = '<option value="">Select a service...</option>';
            try {
                const response = await fetch(`${API_BASE}/service-catalog`);
                const data = await response.json();
                if (data.success && data.services) {
                    data.services.forEach(s => { const opt = document.createElement("option"); opt.value = s.serviceId; opt.textContent = s.serviceName; select.appendChild(opt); });
                }
            } catch (e) { console.error("Failed to load service catalog", e); }
        }

        async function handleServiceCatalogChange() {
            const serviceId = document.getElementById("serviceCatalogSelect").value;
            const container = document.getElementById("dynamicServiceFields");
            const fixedFields = document.getElementById("fixedServiceFields");
            container.innerHTML = "";
            currentServiceFormConfig = null;
            if (!serviceId) { fixedFields.style.display = "none"; return; }
            try {
                const response = await fetch(`${API_BASE}/service-catalog/${serviceId}/form`);
                const data = await response.json();
                if (!data.success || !data.form) { container.innerHTML = '<div class="col-12 text-danger">Could not load the form for this service.</div>'; return; }
                currentServiceFormConfig = data.form;
                renderDynamicServiceFields(currentServiceFormConfig);
                fixedFields.style.display = "block";
            } catch (e) {
                console.error("Failed to load service form config", e);
                container.innerHTML = '<div class="col-12 text-danger">Could not load the form for this service.</div>';
            }
        }

        function renderDynamicServiceFields(formConfig) {
            const container = document.getElementById("dynamicServiceFields");
            container.innerHTML = "";
            const fields = [...(formConfig.formFields || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
            fields.forEach(field => {
                if (field.type === "row") {
                    const children = [...(field.children || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
                    children.forEach(child => container.insertAdjacentHTML("beforeend", buildDynamicFieldMarkup(child, "col-md-6")));
                } else {
                    container.insertAdjacentHTML("beforeend", buildDynamicFieldMarkup(field, "col-md-6"));
                }
            });
            fields.forEach(field => {
                if (field.type === "row") (field.children || []).forEach(wireDynamicField);
                else wireDynamicField(field);
            });
            applyPendingUserPrefill();
            computePricing();
        }

        // Recompute the price breakdown whenever a dynamic field changes
        // (attached once - #dynamicServiceFields itself is never replaced,
        // only its contents are, so this delegated listener keeps working
        // across service switches).
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("dynamicServiceFields");
            if (container) { container.addEventListener("input", computePricing); container.addEventListener("change", computePricing); }
        });

        function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

        function updateManualPriceSummary() {
            const input = document.getElementById("price");
            const amount = round2(input ? input.value : 0);
            currentPriceSummary = { items: [{ amount, label: "Manual Price" }], total: amount };
        }

        function computePricing() {
            const section = document.getElementById("priceSection");
            if (!section) return;
            const pricingConfig = currentServiceFormConfig && currentServiceFormConfig.pricingConfig;

            // Services under manual review (e.g. "Concierge Services") have no
            // pricingConfig - price has to be entered by hand for those.
            if (!pricingConfig) {
                section.innerHTML = `<label class="form-label">Price</label><input type="number" class="form-control" id="price" step="0.01" placeholder="Manual - requires review" oninput="updateManualPriceSummary()">`;
                updateManualPriceSummary();
                return;
            }

            const values = collectDynamicFieldValues();
            let amount = Number(pricingConfig.basePrice) || 0;
            const items = [{ amount: round2(amount), label: "Base Price" }];

            (pricingConfig.rules || []).forEach(rule => {
                const fieldValue = values[rule.field];
                let matches = false;
                if (rule.operator === "greater_than") matches = Number(fieldValue) > Number(rule.value);
                else if (rule.operator === "equals") matches = String(fieldValue) === String(rule.value);
                if (!matches) return;

                const effect = rule.effect || {};
                let lineAmount = 0;
                if (effect.type === "replace_price" || effect.type === "add_flat") {
                    lineAmount = Number(effect.amount) || 0;
                } else if (effect.type === "add_per_extra_unit") {
                    const extraUnits = Number(fieldValue) - Number(effect.baseIncluded || 0);
                    if (extraUnits > 0) lineAmount = extraUnits * (Number(effect.amount) || 0);
                }
                if (lineAmount) { amount += lineAmount; items.push({ amount: round2(lineAmount), label: rule.label }); }
            });

            const taxCfg = pricingConfig.tax || {};
            const taxAmount = taxCfg.type === "percentage"
                ? amount * (Number(taxCfg.value) || 0) / 100
                : Number(taxCfg.value) || 0;
            items.push({ amount: round2(taxAmount), label: taxCfg.type === "percentage" ? `Tax (${taxCfg.value}%)` : "Tax" });

            const convenienceCfg = pricingConfig.convenienceFee || {};
            const convenienceFee = convenienceCfg.type === "percentage"
                ? amount * (Number(convenienceCfg.value) || 0) / 100
                : Number(convenienceCfg.value) || 0;
            items.push({ amount: round2(convenienceFee), label: "Convenience Fee" });

            const total = round2(amount + convenienceFee + taxAmount);
            currentPriceSummary = { items, total };

            section.innerHTML = `
                <label class="form-label">Price Details</label>
                <div class="small border rounded p-2 bg-light">
                    ${items.map(item => `<div class="d-flex justify-content-between${item.label === "Base Price" ? "" : " text-muted"}"><span>${item.label}</span><span>₹${item.amount.toFixed(2)}</span></div>`).join("")}
                    <div class="d-flex justify-content-between fw-bold border-top mt-1 pt-1"><span>Total Payable</span><span>₹${total.toFixed(2)}</span></div>
                </div>
                <input type="hidden" id="price" value="${total}">
            `;
        }

        function applyPendingUserPrefill() {
            if (!pendingUserPrefill) return;
            const nameInput = document.getElementById("dyn_full_name");
            if (nameInput && !nameInput.value) nameInput.value = pendingUserPrefill.firstName || "";
            const phoneInput = document.getElementById("dyn_phone_number");
            if (phoneInput && !phoneInput.value) phoneInput.value = pendingUserPrefill.phoneNumber || "";
        }

        function fieldLabel(field) { return `${field.label || field.key}${field.required ? " *" : ""}`; }

        function buildDynamicFieldMarkup(field, colClass) {
            const id = `dyn_${field.key}`;
            const required = field.required ? "required" : "";
            let inputHtml = "";

            switch (field.type) {
                case "textarea":
                    inputHtml = `<textarea class="form-control" id="${id}" rows="2" placeholder="${field.placeholder || ""}" ${required}></textarea>`;
                    break;
                case "number": {
                    const v = field.validation || {};
                    inputHtml = `<input type="number" class="form-control" id="${id}" placeholder="${field.placeholder || ""}" ${v.min !== undefined ? `min="${v.min}"` : ""} ${v.max !== undefined ? `max="${v.max}"` : ""} ${required}>`;
                    break;
                }
                case "date":
                    inputHtml = `<input type="date" class="form-control" id="${id}" ${required}>`;
                    break;
                case "phone":
                    inputHtml = `<input type="tel" class="form-control" id="${id}" ${required}>`;
                    break;
                case "select":
                case "toggle": {
                    const opts = (field.options || []).map(o => {
                        const label = typeof o === "string" ? o : o.label;
                        const value = typeof o === "string" ? o : o.value;
                        const selected = field.defaultValue === value ? "selected" : "";
                        return `<option value="${value}" ${selected}>${label}</option>`;
                    }).join("");
                    inputHtml = `<select class="form-control" id="${id}" ${required}><option value="">Select...</option>${opts}</select>`;
                    break;
                }
                case "multi_select": {
                    const checks = (field.options || []).map((o, idx) => {
                        const label = typeof o === "string" ? o : o.label;
                        const value = typeof o === "string" ? o : o.value;
                        return `<div class="form-check"><input class="form-check-input dyn-multi-checkbox" type="checkbox" data-key="${field.key}" id="${id}_${idx}" value="${value}"><label class="form-check-label" for="${id}_${idx}">${label}</label></div>`;
                    }).join("");
                    inputHtml = `<div id="${id}">${checks}</div>`;
                    break;
                }
                case "time_slot":
                    inputHtml = `
                        <select class="form-control" id="${id}_label" onchange="handleDynamicTimeSlotChange('${field.key}')" ${required}>
                            <option value="">Select...</option>
                            <option value="Morning">Morning (6 AM - 12 PM)</option>
                            <option value="Afternoon">Afternoon (12 PM - 6 PM)</option>
                            <option value="Evening">Evening (6 PM - 10 PM)</option>
                            <option value="Custom">Custom</option>
                        </select>
                        <div class="row mt-2" id="${id}_customRow" style="display:none;">
                            <div class="col-6"><label class="form-label small">Start Time</label><input type="time" class="form-control" id="${id}_start"></div>
                            <div class="col-6"><label class="form-label small">End Time</label><input type="time" class="form-control" id="${id}_end"></div>
                        </div>`;
                    break;
                case "postcard_chat_selector":
                    inputHtml = `<input type="text" class="form-control" id="${id}" placeholder="Enter chat ID" ${required}>`;
                    break;
                default:
                    inputHtml = `<input type="text" class="form-control" id="${id}" placeholder="${field.placeholder || ""}" ${required}>`;
            }

            const helper = field.helperText ? `<div class="form-text">${field.helperText}</div>` : "";
            return `<div class="${colClass} mb-3" data-field-key="${field.key}"><label class="form-label">${fieldLabel(field)}</label>${inputHtml}${helper}</div>`;
        }

        function wireDynamicField(field) {
            const id = `dyn_${field.key}`;
            if (field.dataSource && field.dataSource.mode === "dynamic") populateDynamicSelect(field);
            if (field.type === "select" && field.defaultValue) { const el = document.getElementById(id); if (el) el.value = field.defaultValue; }
        }

        async function populateDynamicSelect(field) {
            const select = document.getElementById(`dyn_${field.key}`);
            if (!select) return;
            try {
                const response = await fetch(`${API_BASE}/data-source/resolve`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sourceKey: field.dataSource.sourceKey,
                        labelField: field.dataSource.labelField,
                        valueField: field.dataSource.valueField,
                        filters: field.dataSource.filters || []
                    })
                });
                const data = await response.json();
                select.innerHTML = '<option value="">Select...</option>';
                (data.items || []).forEach(item => {
                    const opt = document.createElement("option");
                    opt.value = item.value;
                    opt.textContent = item.label;
                    select.appendChild(opt);
                });
            } catch (e) { console.error(`Failed to load options for ${field.key}`, e); }
        }

        function handleDynamicTimeSlotChange(key) {
            const val = document.getElementById(`dyn_${key}_label`).value;
            document.getElementById(`dyn_${key}_customRow`).style.display = val === "Custom" ? "flex" : "none";
        }

        function getDynamicTimeSlotDetails(key) {
            const label = document.getElementById(`dyn_${key}_label`).value;
            const slots = { Morning: { startTime: "06:00", endTime: "12:00" }, Afternoon: { startTime: "12:00", endTime: "18:00" }, Evening: { startTime: "18:00", endTime: "22:00" } };
            if (label === "Custom") return { label: "Custom", startTime: document.getElementById(`dyn_${key}_start`).value, endTime: document.getElementById(`dyn_${key}_end`).value };
            return { label, ...(slots[label] || {}) };
        }

        function collectDynamicFieldValues() {
            if (!currentServiceFormConfig) return {};
            const values = {};
            const allFields = [];
            (currentServiceFormConfig.formFields || []).forEach(f => f.type === "row" ? allFields.push(...(f.children || [])) : allFields.push(f));

            allFields.forEach(field => {
                const id = `dyn_${field.key}`;
                if (field.type === "multi_select") {
                    values[field.key] = Array.from(document.querySelectorAll(`.dyn-multi-checkbox[data-key="${field.key}"]:checked`)).map(cb => cb.value);
                } else if (field.type === "time_slot") {
                    values[field.key] = getDynamicTimeSlotDetails(field.key);
                } else {
                    const el = document.getElementById(id);
                    if (el) values[field.key] = el.value;
                }
            });
            return values;
        }

        // field_values, as sent to the backend: select/toggle fields keep both
        // their label and value (so the request/order documents stay readable
        // without needing to re-resolve option lists later); every other field
        // keeps its raw value.
        function buildFieldValuesForSubmit() {
            if (!currentServiceFormConfig) return {};
            const raw = collectDynamicFieldValues();
            const allFields = [];
            (currentServiceFormConfig.formFields || []).forEach(f => f.type === "row" ? allFields.push(...(f.children || [])) : allFields.push(f));

            const fieldValues = {};
            allFields.forEach(field => {
                const value = raw[field.key];
                if ((field.type === "select" || field.type === "toggle") && value) {
                    const el = document.getElementById(`dyn_${field.key}`);
                    const selectedOption = el ? el.options[el.selectedIndex] : null;
                    fieldValues[field.key] = { label: selectedOption ? selectedOption.textContent : value, value };
                } else {
                    fieldValues[field.key] = value;
                }
            });
            return fieldValues;
        }

        async function submitServiceRequest() {
            const serviceId = document.getElementById("serviceCatalogSelect").value;
            if (!serviceId) { alert("Please select a service"); return; }

            const details = {
                serviceId,
                paymentStatus: document.getElementById("paymentStatus").value,
                fieldValues: buildFieldValuesForSubmit(),
                priceSummary: currentPriceSummary
            };
            try {
                const btn = document.querySelector('[onclick="submitServiceRequest()"]'); btn.disabled = true; btn.innerHTML = 'Submitting...';
                const response = await fetch(`${API_BASE}/magic-words/${currentMagicWordId}/status`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bookingType: serviceId, details, status: "inProgress" }) });
                const result = await response.json();
                if (result.success) { bootstrap.Modal.getInstance(document.getElementById("serviceRequestModal")).hide(); document.getElementById("detail-status").textContent = result.new_status; document.getElementById("detail-status").className = `badge ${getStatusBadgeClass(result.new_status)}`; updateStatusButtonText(result.new_status); alert("âœ… Service request submitted!"); setTimeout(() => loadMagicWordRequests(), 1500); }
                else { alert(`Error: ${result.error}`); }
            } catch (error) { alert("Error submitting request"); }
            finally { const btn = document.querySelector('[onclick="submitServiceRequest()"]'); btn.disabled = false; btn.innerHTML = 'Submit'; }
        }

        async function updateMagicWordStatus(targetStatus = null, navigateBack = true, reason = null) {
            try {
                const body = {};
                if (targetStatus) body.status = targetStatus;
                if (reason) body.reason = reason;
                const response = await fetch(`${API_BASE}/magic-words/${currentMagicWordId}/status`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                const result = await response.json();
                if (result.success) {
                    document.getElementById("detail-status").textContent = result.new_status;
                    document.getElementById("detail-status").className = `badge ${getStatusBadgeClass(result.new_status)}`;
                    updateStatusButtonText(result.new_status);
                    if (navigateBack) { alert("âœ… Status updated!"); setTimeout(() => showListView(), 1500); }
                } else { alert(`Error: ${result.error}`); }
            } catch (error) { alert("Error updating status"); }
        }

        function updateStatusButtonText(status) {
            const btn = document.getElementById("statusChangeBtn");
            if (status === "requested") { btn.textContent = "Proceed to Service"; btn.disabled = false; }
            else if (status === "inProgress") { btn.textContent = !currentServiceRequestId ? "Proceed to Service" : "Mark Complete"; btn.disabled = false; }
            else { btn.textContent = "Completed"; btn.disabled = true; }
        }

        async function uploadCustomerServiceImage(file, chatId) {
            const formData = new FormData();
            formData.append("file", file); formData.append("chatId", chatId); formData.append("magicWordId", currentMagicWordId || "");
            const resp = await fetch(`${BASE}/api/upload-customer-service-image`, { method: "POST", body: formData });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || "Image upload failed");
            return data.imageUrl;
        }

        function handleChatComposerKeydown(event) {
            if (event.key === "Enter" && event.ctrlKey) {
                event.preventDefault();
                sendMessageToUser();
            }
        }

        function updateSendButtonState() {
            const btn = document.getElementById("sendMessageBtn");
            if (!btn) return;
            const hasText = document.getElementById("customMessage").value.trim().length > 0;
            const hasImage = !!document.getElementById("chatImageFile")?.files?.length;
            btn.disabled = !(hasText || hasImage);
        }

        function handleChatImageSelected() {
            const file = document.getElementById("chatImageFile").files?.[0];
            const chip = document.getElementById("chatImagePreview");
            if (!file) {
                chip.classList.add("hidden");
                chip.innerHTML = "";
            } else {
                chip.classList.remove("hidden");
                chip.innerHTML = `${escapeHtml(file.name)} <button type="button" onclick="clearChatImageSelection()" aria-label="Remove attachment">&times;</button>`;
            }
            updateSendButtonState();
        }

        function clearChatImageSelection() {
            const input = document.getElementById("chatImageFile");
            if (input) input.value = "";
            const chip = document.getElementById("chatImagePreview");
            if (chip) { chip.classList.add("hidden"); chip.innerHTML = ""; }
            updateSendButtonState();
        }

        async function sendMessageToUser() {
            const chatId = document.getElementById("detail-chatId").textContent.trim();
            if (!chatId) { alert("Chat ID not found"); return; }

            const content = document.getElementById("customMessage").value.trim();
            const file = document.getElementById("chatImageFile")?.files?.[0] || null;
            if (!content && !file) { alert("Enter a message or attach an image"); return; }

            const btn = document.getElementById("sendMessageBtn");
            let imageUrl = null;
            btn.disabled = true;
            try {
                if (file) {
                    imageUrl = await uploadCustomerServiceImage(file, chatId);
                }
                const response = await fetch(`${BASE}/api/magic-words/${currentMagicWordId}/send-message`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messageType: "custom", message: content, imageUrl: imageUrl || null, chatId }) });
                const result = await response.json();
                if (result.success) {
                    document.getElementById("customMessage").value = "";
                    clearChatImageSelection();
                    await loadChatMessages(chatId);
                } else { alert(`Error: ${result.error}`); }
            } catch (error) { alert("Error sending message: " + (error.message || error)); }
            finally { updateSendButtonState(); }
        }

        function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }

        async function toggleHumanInteraction() {
            const toggle = document.getElementById("humanInteractionToggle");
            const statusLabel = document.getElementById("toggleLabel");
            const statusBadge = document.getElementById("toggleStatus");
            const chatId = document.getElementById("detail-chatId").textContent.trim();
            if (!chatId || chatId === "N/A") { alert("Chat ID not found"); toggle.checked = !toggle.checked; return; }
            try {
                const isHuman = toggle.checked;
                statusLabel.textContent = isHuman ? "kabirTeam" : "kabirAI";
                statusBadge.className = isHuman ? "badge bg-success" : "badge bg-secondary";
                statusBadge.textContent = "Active";
                const response = await fetch(`${BASE}/api/chats/${chatId}/toggle-interaction`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ isHumanInteraction: isHuman }) });
                const result = await response.json();
                if (!result.success) { alert(`Error: ${result.error}`); toggle.checked = !toggle.checked; statusLabel.textContent = toggle.checked ? "kabirTeam" : "kabirAI"; statusBadge.className = toggle.checked ? "badge bg-success" : "badge bg-secondary"; }
            } catch (error) { alert("Error updating interaction mode"); toggle.checked = !toggle.checked; }
        }

        async function submitCompletionReason() {
            const reason = document.getElementById("completionReason").value.trim();
            if (!reason) { alert("Please enter a reason for completion."); return; }
            bootstrap.Modal.getInstance(document.getElementById("completionReasonModal")).hide();
            await updateMagicWordStatus("completed", true, reason);
        }
</script>
