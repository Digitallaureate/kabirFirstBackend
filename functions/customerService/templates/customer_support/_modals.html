    <!-- Service Request Modal -->
    <div id="serviceRequestModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Service Request Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="serviceRequestForm">
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label">Service *</label>
                                <select class="form-control" id="serviceCatalogSelect"
                                    onchange="handleServiceCatalogChange()" required>
                                    <option value="">Select a service...</option>
                                </select>
                            </div>
                        </div>

                        <div class="row" id="dynamicServiceFields"></div>

                        <div id="fixedServiceFields" style="display:none;">
                            <hr>
                            <div class="row">
                                <div class="col-12 mb-3" id="priceSection"></div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Payment Status</label>
                                    <select class="form-control" id="paymentStatus">
                                        <option value="pending">Pending</option>
                                        <option value="success">Success</option>
                                        <option value="failed">Failed</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitServiceRequest()">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Completion Reason Modal -->
    <div class="modal fade" id="completionReasonModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Complete Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="completionReason" class="form-label">Reason / Notes</label>
                        <textarea class="form-control" id="completionReason" rows="3"
                            placeholder="Enter reason for completion..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitCompletionReason()">Submit</button>
                </div>
            </div>
        </div>
    </div>
