<div class="traviz-hero dashboard-only traviz-overview-only">
    <div class="traviz-hero-text">
        <h1>Customer Support</h1>
        <p>Manage traveller requests and service orders</p>
        <div class="traviz-range">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="4" y="5.5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
                <path d="M4 9.5h16M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <select id="statsRangeSelect" onchange="handleStatsRangeChange()" aria-label="Stats reporting range">
                <option value="7" selected>Last 7 days</option>
                <option value="30">Last 1 month</option>
                <option value="90">Last 3 months</option>
                <option value="custom">Custom range</option>
            </select>
            <span id="statsRangeCustomInputs" class="traviz-range-custom hidden">
                <input type="date" id="statsRangeStart" onchange="handleStatsRangeChange()" />
                <span>to</span>
                <input type="date" id="statsRangeEnd" onchange="handleStatsRangeChange()" />
            </span>
        </div>
    </div>
    <span class="traviz-hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1" />
            <path d="M15.25 8.75 13 13l-4.25 2.25L11 11l4.25-2.25Z" fill="currentColor" stroke="currentColor"
                stroke-width="0.5" stroke-linejoin="round" />
        </svg>
    </span>
</div>

<div class="traviz-stats dashboard-only traviz-overview-only">
    <div class="traviz-stat">
        <span class="traviz-stat-icon" style="background:#ffe8f0;color:#f43770;" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 5.5h16v10a1 1 0 0 1-1 1H8l-4 4v-4H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" stroke="currentColor"
                    stroke-width="1.6" stroke-linejoin="round" />
                <path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
        </span>
        <div><strong id="requestCount">0</strong><span>New Requests</span></div>
    </div>
    <div class="traviz-stat">
        <span class="traviz-stat-icon" style="background:#e7f2ff;color:#147fed;" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12.5" r="8" stroke="currentColor" stroke-width="1.6" />
                <path d="M12 8v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </span>
        <div><strong id="inProgressCount">0</strong><span>In Progress</span></div>
    </div>
    <div class="traviz-stat">
        <span class="traviz-stat-icon" style="background:#fff0d8;color:#f09010;" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 4.5h8a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Z"
                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M9.5 3.5h5a.5.5 0 0 1 .5.5v1.5H9V4a.5.5 0 0 1 .5-.5Z" fill="currentColor" />
                <path d="M9 10h6M9 13h6M9 16h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
        </span>
        <div><strong id="orderRequestCount">0</strong><span>Open Orders</span></div>
    </div>
    <div class="traviz-stat">
        <span class="traviz-stat-icon" style="background:#ddf8e9;color:#21aa61;" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6" />
                <path d="m8.5 12.3 2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </span>
        <div><strong id="completedCount">0</strong><span>Completed</span></div>
    </div>
</div>

<section class="traviz-user-panel dashboard-only traviz-overview-only">
    <div class="panel-body">
        <div id="userErrorMessage" class="alert alert-danger hidden mb-2"></div>
        <div id="userSummaryContent" class="hidden">
            <div class="row g-2">
                <div class="col-lg-4">
                    <div class="user-info-card mb-0">
                        <h6>User Details</h6>
                        <p><strong>ID:</strong> <code id="summary-userId"></code></p>
                        <p><strong>Name:</strong> <span id="summary-userName"></span></p>
                        <p><strong>Phone:</strong> <span id="summary-userPhone"></span></p>
                        <p><strong>Email:</strong> <span id="summary-userEmail"></span></p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="user-info-card mb-0" id="locationCard" style="display:none;">
                        <h6>Location</h6>
                        <p><strong>Place:</strong> <span id="summary-location"></span></p>
                        <p><strong>Coords:</strong> <span id="summary-coords"></span></p>
                        <p><strong>Recorded:</strong> <span id="summary-recordedAt"></span></p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="user-info-card mb-0">
                        <h6>Chats</h6>
                        <p><strong>Total:</strong> <span id="summary-chatCount" class="badge bg-info">0</span></p>
                        <p><strong>Latest:</strong> <span id="summary-latestChat"></span></p>
                        <button class="btn btn-primary btn-sm mt-2" onclick="filterRequestsByUser()">View
                            User Requests</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="userInitialMessage" class="alert alert-info mb-0 hidden">Search a phone number or email to
            inspect a traveller profile.</div>
    </div>
</section>
