<div class="traviz-panel traviz-order-panel">
    <div class="traviz-panel-head">
        <div class="traviz-panel-title">
            <span class="traviz-panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 4.5h8a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Z"
                        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    <path d="M9.5 3.5h5a.5.5 0 0 1 .5.5v1.5H9V4a.5.5 0 0 1 .5-.5Z" fill="currentColor" />
                    <path d="M9 10h6M9 13h6M9 16h3.5" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" />
                </svg>
            </span>
            <div>
                <b>Recent Service Orders</b>
                <small>Latest service orders and booking status</small>
            </div>
        </div>
        <div class="traviz-actions">
            <button class="traviz-mini-btn" type="button" onclick="loadServiceOrderRequests(currentFilteredOrderUserId)">Refresh</button>
            <button class="traviz-link-btn" type="button" onclick="clearOrderUserFilter()">View All</button>
        </div>
    </div>
    <form class="traviz-search traviz-panel-search" onsubmit="event.preventDefault();" role="search">
        <span aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" />
                <path d="m20 20-3.8-3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
        </span>
        <input type="text" id="orderSearchQuery"
            placeholder="Search this list by traveller, service, status, or user ID..."
            oninput="filterOrderSearch()" />
    </form>
    <div id="orderFilterBadgeContainer"></div>
    <div id="orderRequestsList" class="traviz-list"></div>
    <div id="orderEmptyMessage" class="alert alert-info text-center traviz-empty hidden">No booked service orders found</div>
</div>
