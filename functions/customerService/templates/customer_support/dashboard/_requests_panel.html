<div class="traviz-panel traviz-request-panel">
    <div class="traviz-panel-head">
        <div class="traviz-panel-title">
            <span class="traviz-panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 5.5h16v10a1 1 0 0 1-1 1H8l-4 4v-4H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"
                        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    <path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
            </span>
            <div>
                <b>Request Queue</b>
                <small>Latest traveller requests requiring your attention</small>
            </div>
        </div>
        <div class="traviz-actions">
            <button class="traviz-mini-btn" type="button" onclick="loadMagicWordRequests(currentFilteredUserId)">Refresh</button>
            <button class="traviz-link-btn" type="button" onclick="clearUserFilter()">View All</button>
        </div>
    </div>
    <div id="filterBadgeContainer"></div>
    <div id="requestsList" class="traviz-list"></div>
    <div id="emptyMessage" class="alert alert-info text-center traviz-empty hidden">No magic word requests found</div>
</div>
