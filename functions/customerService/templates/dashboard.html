<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Kabir – Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #333;
        }
        #homeView {
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 2rem;
        }
        .home-title { font-size: 2rem; font-weight: 700; color: #2c3e50; margin-bottom: 0.4rem; }
        .home-subtitle { color: #7f8c8d; font-size: 1rem; margin-bottom: 3rem; }

        .service-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem; width: 100%; max-width: 700px;
        }
        .service-card {
            background: white; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0; padding: 2rem 1.5rem;
            text-align: center; cursor: pointer;
            transition: all 0.25s ease; color: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        .service-card:hover {
            box-shadow: 0 8px 28px rgba(44,62,80,0.18);
            transform: translateY(-4px); border-color: #2c3e50;
        }
        .service-card-icon { font-size: 3rem; line-height: 1; }
        .service-card-title { font-size: 1.2rem; font-weight: 700; color: #2c3e50; }
        .service-card-desc { font-size: 0.88rem; color: #7f8c8d; line-height: 1.5; }
        .go-arrow {
            font-size: 1.4rem; color: #2c3e50; margin-top: 0.5rem;
            opacity: 0.5; transition: opacity 0.2s, transform 0.2s;
        }
        .service-card:hover .go-arrow { opacity: 1; transform: translateX(4px); }
    </style>
</head>
<body>
    <div id="homeView">
        <div class="text-center">
            <h1 class="home-title">Kabir Admin Dashboard</h1>
            <p class="home-subtitle">Select a panel to get started</p>
        </div>
        <div class="service-cards-grid">
            <div class="service-card" onclick="navigate('customer-support')">
                <div class="service-card-icon">🎧</div>
                <div class="service-card-title">Customer Support</div>
                <div class="service-card-desc">Manage magic word requests, live chat, and user support tickets.</div>
                <div class="go-arrow">→</div>
            </div>
            <div class="service-card" onclick="navigate('orders')">
                <div class="service-card-icon">🛒</div>
                <div class="service-card-title">Service Orders</div>
                <div class="service-card-desc">View and manage booked service orders and vendor assignments.</div>
                <div class="go-arrow">→</div>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    {% include "_customer_service_helpers.html" %}
    <script>
        const BASE = getCustomerServiceBasePath();

        function navigate(panel) {
            navigateCustomerService(`/${panel}`);
        }

        async function logout() {
            await logoutCustomerService();
        }
    </script>
</body>
</html>
